<!doctype html>
<!-- Alumno: Jose Luis Mas García | Práctica: Asistentes Conversacionales - CampusBot -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusBot</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#202124}
    .wrap{max-width:760px;margin:40px auto;padding:0 16px}.card{background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08);overflow:hidden}
    header{padding:18px 20px;border-bottom:1px solid #e7e7e7}h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#666;font-size:14px}
    #chat{height:480px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.msg{max-width:78%;padding:10px 12px;border-radius:10px;line-height:1.35;white-space:pre-wrap}
    .bot{align-self:flex-start;background:#eef1f5}.user{align-self:flex-end;background:#dfe8ff}form{display:flex;gap:8px;padding:14px;border-top:1px solid #e7e7e7}
    input{flex:1;padding:11px 12px;border:1px solid #cfcfcf;border-radius:8px;font-size:15px}button{border:0;border-radius:8px;padding:0 18px;cursor:pointer;background:#1a73e8;color:#fff}
    .small{color:#777;font-size:12px;margin-top:10px;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header><h1>CampusBot</h1><p>Asistente de apoyo para estudiantes</p></header>
      <div id="chat"><div class="msg bot">Hola. Soy CampusBot. Puedes preguntarme qué puedo hacer o pedirme que te ayude a organizar una sesión de estudio.</div></div>
      <form id="form"><input id="input" autocomplete="off" placeholder="Escribe un mensaje..."><button>Enviar</button></form>
    </div>
    <div class="small">Práctica de asistentes conversacionales - Jose Luis Mas García</div>
  </div>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('input');
const sessionId=crypto.randomUUID?crypto.randomUUID():String(Date.now());
function add(text,cls){const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add(text,'user');input.value='';input.disabled=true;
try{const r=await fetch('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,sessionId})});const data=await r.json();add(data.reply||data.error||'Ha ocurrido un error.','bot')}
catch(e){add('No se ha podido conectar con el servidor.','bot')}finally{input.disabled=false;input.focus()}});
</script>
</body>
</html>
