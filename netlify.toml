[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/message"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/weather-webhook"
  to = "/.netlify/functions/weather-webhook"
  status = 200
